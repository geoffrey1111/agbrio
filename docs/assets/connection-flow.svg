<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
 <title id="title">Agbrio: personal desktop Host, phone PWA, two agent conversations</title>
 <desc id="desc">A phone reaches the desktop Host through a user-selected HTTPS entry. The Host connects control and execution conversations; each handoff requires user confirmation.</desc>
 <rect width="1120" height="420" fill="#fffcf8"/>
 <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#342d27">
  <text x="40" y="48" font-size="28" font-weight="650">Your computer. Your conversations.</text>
  <text x="40" y="78" font-size="16" fill="#76675a">Conceptual topology · no Agbrio-hosted account service</text>
  <rect x="40" y="140" width="220" height="164" rx="16" fill="#f0ebe4"/>
  <g fill="none" stroke="#a55735" stroke-width="3"><rect x="65" y="164" width="20" height="32" rx="4"/><path d="M70 189h10"/></g>
  <text x="65" y="231" font-size="23" font-weight="600">Phone PWA</text>
  <text x="65" y="263" font-size="16">Read · select · confirm</text>
  <rect x="460" y="140" width="250" height="164" rx="16" fill="#f6e8dc"/>
  <g fill="none" stroke="#a55735" stroke-width="3"><rect x="485" y="167" width="32" height="23" rx="3"/><path d="M501 190v7m-10 0h20"/></g>
  <text x="485" y="231" font-size="23" font-weight="600">Desktop Host</text>
  <text x="485" y="263" font-size="16">Bindings · files · receipts</text>
  <rect x="850" y="118" width="230" height="98" rx="16" fill="#f0ebe4"/>
  <text x="875" y="158" font-size="21" font-weight="600">Control conversation</text>
  <text x="875" y="186" font-size="16">Plan &amp; review</text>
  <rect x="850" y="244" width="230" height="98" rx="16" fill="#f0ebe4"/>
  <text x="875" y="284" font-size="21" font-weight="600">Execution conversation</text>
  <text x="875" y="312" font-size="16">Build &amp; report</text>
  <g fill="none" stroke="#a55735" stroke-width="2.5"><path d="M276 222h166m-8-7 8 7-8 7M284 215l-8 7 8 7"/><path d="M726 222h55v-55h52m-8-7 8 7-8 7M781 222v71h52m-8-7 8 7-8 7"/></g>
  <text x="358" y="193" text-anchor="middle" font-size="16" fill="#76675a">Your HTTPS entry</text>
  <text x="358" y="255" text-anchor="middle" font-size="14" fill="#76675a">Current: Cloudflare Tunnel</text>
  <text x="40" y="385" font-size="17" fill="#76675a">Each cross-conversation handoff stays under your explicit confirmation.</text>
 </g>
</svg>
