<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Agbrio · Connect assistant</title><style nonce="{{NONCE}}">
:root{font-family:system-ui,sans-serif;color:#302b26;background:#fffcf8}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}h1{font-size:26px;margin:16px 0}p{line-height:1.5;overflow-wrap:anywhere}label{display:block;margin:20px 0 8px}input,select,button{font:inherit;min-height:44px;border-radius:12px}input,select{width:100%;padding:12px;border:1px solid #d7cec3;background:#fff}button{padding:12px 18px;border:0;background:#a65432;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a65432;outline-offset:3px}.actions{display:flex;gap:12px;margin-top:24px}.secondary{background:#eee8df;color:#302b26}li{line-height:1.5;margin:8px 0}.muted{color:#70665b;font-size:14px}#error{color:#9a332b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit} [hidden]{display:none!important}
</style></head><body><main><h1 id="title">Connect assistant</h1><p id="intro">Agbrio · Agent Bridge</p><form id="pair" hidden><label id="codeLabel" for="code">Pairing code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><p id="pairHelp" class="muted">Get a code from Agbrio desktop → Devices.</p><button id="pairButton">Sign in</button></form><section id="review" hidden><p id="client"></p><p id="redirect" class="muted"></p><label id="grantLabel" for="grant">Delegation</label><select id="grant"></select><pre id="target"></pre><ul id="rules"></ul><p id="notice" class="muted"></p><div class="actions"><button id="allow" disabled>Allow</button><button id="deny" class="secondary">Cancel</button></div></section><p id="error" role="alert"></p></main><script nonce="{{NONCE}}">
const zh=navigator.language.toLowerCase().startsWith('zh'),tw=/tw|hk|hant/i.test(navigator.language);document.documentElement.lang=zh?(tw?'zh-TW':'zh-CN'):'en';
const copy=zh?(tw?['連接助手','配對碼','在 Agbrio 電腦端 → 設備取得配對碼。','登入','授權','允許並連接','取消','助手可按這些規則审批並轉發；缺少決策時先問你。可在設定中撤銷。','沒有有效授權。請先在 Agbrio 電腦端 → 設定 → AI 助手新增。','連接失敗，請檢查登入或重新發起連接。']:['连接助手','配对码','在 Agbrio 电脑端 → 设备取得配对码。','登录','授权','允许并连接','取消','助手可按这些规则审批并转发；缺少决策时先问你。可在设置中撤销。','没有有效授权。请先在 Agbrio 电脑端 → 设置 → AI 助手添加。','连接失败，请检查登录或重新发起连接。']):['Connect assistant','Pairing code','Get a code from Agbrio desktop → Devices.','Sign in','Delegation','Allow and connect','Cancel','The assistant may approve and forward under these rules. It asks you about missing decisions. Revoke access in Settings.','No active delegation. Add one in Agbrio desktop → Settings → AI assistant.','Connection failed. Check sign-in or start a new connection.'];
const $=id=>document.getElementById(id);['title','codeLabel','pairHelp','pairButton','grantLabel','allow','deny','notice'].forEach((id,i)=>$(id).textContent=copy[i]);
const request=new URL(location.href).searchParams.get('request');let grants=[],busy=false;
async function api(path,body){const r=await fetch(path,{credentials:'same-origin',method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(copy[9]);return r.json();}
function render(){const entry=grants.find(e=>e.grant.id===$('grant').value);$('allow').disabled=!entry||busy;$('rules').replaceChildren();if(!entry){$('target').textContent=copy[8];return;}const g=entry.grant,b=entry.bindings;if(g.scope==='INSTANCE'){$('target').textContent=zh?(tw?'整個 Agbrio：目前及以後新建的 Bridge、監聽和通知。':'整个 Agbrio：当前及以后新建的 Bridge、监听和通知。'):'Entire Agbrio: current/future Bridges, watches and notifications.';}else{const s=g.sourceRole!=='EXECUTION'?b.decision:b.execution,d=g.sourceRole!=='EXECUTION'?b.execution:b.decision;$('target').textContent=`${s?.endpoint.label} ${g.sourceRole==='BOTH'?'↔':'→'} ${d?.endpoint.label}\n${s?.endpoint.externalId} → ${d?.endpoint.externalId}`;}for(const r of g.rules){const li=document.createElement('li');li.textContent=r.text;$('rules').append(li);}}
async function load(){const auth=await api('/v1/mobile/auth/session');$('pair').hidden=auth.authenticated;$('review').hidden=!auth.authenticated;if(!auth.authenticated)return;const info=await api('/v1/mobile/assistant/consent?request='+encodeURIComponent(request));$('client').textContent=info.clientName;$('redirect').textContent=info.redirectUri;grants=info.grants;$('grant').replaceChildren();for(const e of grants){const o=document.createElement('option');o.value=e.grant.id;o.textContent=e.grant.label;$('grant').append(o);}render();}
$('grant').onchange=render;$('pair').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('pairButton').disabled=true;try{await api('/v1/mobile/auth/pair',{code:$('code').value,deviceName:'Assistant authorization',remember:false});$('code').value='';await load();}catch(e){$('error').textContent=e.message;}finally{busy=false;$('pairButton').disabled=false;render();}};
async function consent(allow){if(busy)return;busy=true;render();$('deny').disabled=true;try{const result=await api('/v1/mobile/assistant/consent',{request,grantId:allow?$('grant').value:null,allow});location.replace(result.redirect);}catch(e){$('error').textContent=e.message;busy=false;render();$('deny').disabled=false;}}
$('allow').onclick=()=>consent(true);$('deny').onclick=()=>consent(false);load().catch(e=>$('error').textContent=e.message);
</script></body></html>
