name: macOS source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      AGBRIO_HOSTED_CONTROL_ORIGIN: https://agbrio-connect.geoffreygroup.cc
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            crates -> target
            src-tauri -> target
      - name: Verify native build platform
        run: |
          test "$(uname -m)" = arm64
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          sw_vers
          rustc --version
          node --version
      - name: Locked frontend and helper dependencies
        run: |
          npm ci
      - name: Frontend and platform tests
        run: |
          /bin/sh -n src/features/workbench/claudeManualInstall.macos.sh
          npm test -- --maxWorkers=2
          node --test scripts/browser-executor-platform.test.mjs
          node --test tools/agbrio-control/control.test.mjs
          node --test tools/shared-codex-macos/lifecycle.test.mjs
          python3 -m unittest discover -s scripts -p test_macos_update_package.py
          node --test scripts/create-macos-update-manifest.test.mjs
          node --test scripts/claude-usage-statusline.test.mjs
          npm run build
      - name: Stage native Node and helper resources
        run: npm run build:node-runtime
      - name: Isolated TLS listener preflight (CI service only)
        shell: bash
        env:
          AGBRIO_FIXTURE_PRIVILEGED_SERVICE: '1'
        run: |
          set -euo pipefail
          npm ci --prefix tools/hosted-relay-fixture
          node tools/hosted-relay-fixture/e2e.mjs --service-only | tee "$RUNNER_TEMP/agbrio-hosted-listener.log"
          grep -Fx 'HOSTED_TEST_SERVICE_PASS' "$RUNNER_TEMP/agbrio-hosted-listener.log"
      - name: Core check and tests
        run: |
          cargo check --manifest-path crates/Cargo.toml --locked --target aarch64-apple-darwin
          cargo test --manifest-path crates/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Desktop check and tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin -- --test-threads=2
      - name: Mac trial identity from IOKit (no identifier output)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin hosted_relay::trial_identity_tests::mac_identity_is_stable_without_exposing_raw_value -- --ignored --exact --test-threads=1 --nocapture | tee "$RUNNER_TEMP/agbrio-trial-identity.log"
          grep -Fx 'MACOS_TRIAL_IDENTITY_NATIVE_PASS' "$RUNNER_TEMP/agbrio-trial-identity.log"
      - name: Isolated hosted TLS WSS and PWA transport
        shell: bash
        env:
          AGBRIO_FIXTURE_PRIVILEGED_SERVICE: '1'
          AGBRIO_FIXTURE_NODE: ${{ github.workspace }}/src-tauri/binaries/browser-executor-node-aarch64-apple-darwin
        run: |
          set -euo pipefail
          npx playwright install chromium
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin --lib --no-run --message-format=json > "$RUNNER_TEMP/agbrio-hosted-test-build.jsonl"
          node tools/hosted-relay-fixture/e2e.mjs --cargo-messages "$RUNNER_TEMP/agbrio-hosted-test-build.jsonl" | tee "$RUNNER_TEMP/agbrio-hosted-e2e.log"
          grep -Fx 'MACOS_HOSTED_E2E_PASS' "$RUNNER_TEMP/agbrio-hosted-e2e.log"
      - name: Isolated Keychain credential lifecycle
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin platform::macos_keychain::tests::isolated_native_roundtrip_and_unrelated_item_survives -- --ignored --exact --test-threads=1
      - name: Isolated same-volume update transaction
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin platform::macos_update_transaction::native::tests::isolated_same_volume_exchange_and_rollback -- --ignored --exact --test-threads=1 --nocapture | tee "$RUNNER_TEMP/agbrio-update-transaction.log"
          grep -Fx 'MACOS_UPDATE_TRANSACTION_NATIVE_PASS' "$RUNNER_TEMP/agbrio-update-transaction.log"
      - name: Isolated signed-format archive staging
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin platform::macos_update_archive::native::tests::isolated_native_archive_staging_and_tamper_rejection -- --ignored --exact --test-threads=1 --nocapture | tee "$RUNNER_TEMP/agbrio-archive-staging.log"
          grep -Fx 'MACOS_ARCHIVE_STAGING_NATIVE_PASS' "$RUNNER_TEMP/agbrio-archive-staging.log"
